<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FoodCare Bot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root{
          --bg1: #07122a;
          --bg2: #021025;
          --glass: rgba(255,255,255,0.06);
          --glass-strong: rgba(255,255,255,0.10);
          --accent-a: #00eaff;
          --accent-b: #ff70a6;
          --text-light: #e6f6ff;
          --muted: #98a3b3;
          --card-radius: 22px;
        }

        *{box-sizing:border-box;margin:0;padding:0;font-family: "Poppins", "Roboto", "Segoe UI", sans-serif;}
        html,body{height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;color:var(--text-light)}

        /* === BACKGROUND LAYERS === */
        .bg-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
        .gradient-haze{
          position:absolute;inset:-30% -30%;
          background:conic-gradient(from 120deg,var(--accent-a),var(--accent-b),#0ea5e9,var(--accent-a));
          filter:blur(140px);opacity:0.12;transform-origin:center;
          animation:spinHaze 22s linear infinite;
        }
        @keyframes spinHaze{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        /* Large moving bubbles (fast & roaming) */
        .bubble-anim{position:absolute;border-radius:50%;background:radial-gradient(circle, rgba(0,234,255,0.22), rgba(0,234,255,0.06));filter:blur(8px);opacity:0.75}
        /* each bubble has different size + movement speed + delay */
        .b1{width:360px;height:360px;left:-10%;top:6%;animation:move1 12s linear infinite}
        .b2{width:280px;height:280px;left:55%;top:2%;animation:move2 10s linear infinite}
        .b3{width:220px;height:220px;left:15%;top:55%;animation:move3 14s linear infinite}
        .b4{width:420px;height:420px;left:60%;top:50%;animation:move4 16s linear infinite}
        .b5{width:200px;height:200px;left:80%;top:15%;animation:move5 11s linear infinite}
        .b6{width:300px;height:300px;left:-12%;top:60%;animation:move6 13s linear infinite}
        @keyframes move1{0%{transform:translate(0,0)}25%{transform:translate(140px,-80px)}50%{transform:translate(-40px,-220px)}75%{transform:translate(-180px,40px)}100%{transform:translate(0,0)}}
        @keyframes move2{0%{transform:translate(0,0)}25%{transform:translate(-160px,-100px)}50%{transform:translate(90px,-180px)}75%{transform:translate(120px,60px)}100%{transform:translate(0,0)}}
        @keyframes move3{0%{transform:translate(0,0)}25%{transform:translate(220px,-120px)}50%{transform:translate(-160px,-80px)}75%{transform:translate(-90px,140px)}100%{transform:translate(0,0)}}
        @keyframes move4{0%{transform:translate(0,0)}25%{transform:translate(-200px,-160px)}50%{transform:translate(200px,-80px)}75%{transform:translate(180px,120px)}100%{transform:translate(0,0)}}
        @keyframes move5{0%{transform:translate(0,0)}25%{transform:translate(-120px,-80px)}50%{transform:translate(140px,-90px)}75%{transform:translate(60px,120px)}100%{transform:translate(0,0)}}
        @keyframes move6{0%{transform:translate(0,0)}25%{transform:translate(180px,-140px)}50%{transform:translate(-200px,-40px)}75%{transform:translate(-60px,160px)}100%{transform:translate(0,0)}}

        /* Spark particles — bigger than before */
        .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd6f0);box-shadow:0 0 22px rgba(255,255,255,0.9);opacity:0.95;will-change:transform;animation:rise 6s linear infinite}
        .s1{left:10%;top:95%;animation-delay:0s}
        .s2{left:30%;top:98%;animation-delay:0.9s}
        .s3{left:52%;top:96%;animation-delay:1.6s}
        .s4{left:72%;top:99%;animation-delay:2.2s}
        .s5{left:88%;top:94%;animation-delay:3s}
        @keyframes rise{0%{transform:translate(0,0) scale(0.9);opacity:1}50%{transform:translate(40px,-420px) scale(1.2);opacity:0.7}100%{transform:translate(-40px,-820px) scale(0.6);opacity:0}}

        /* subtle star-like tiny particles */
        .tiny{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.9);box-shadow:0 0 6px rgba(255,255,255,0.9);opacity:0.8;animation:floatTiny 9s linear infinite}
        .t1{left:20%;top:20%;animation-delay:0s}
        .t2{left:70%;top:30%;animation-delay:1.4s}
        .t3{left:40%;top:70%;animation-delay:2.1s}
        @keyframes floatTiny{0%{transform:translateY(0)}50%{transform:translateY(-50px)}100%{transform:translateY(0)}}

        /* === MAIN LAYOUT === */
        .page {
          position:relative;z-index:5;display:flex;align-items:center;justify-content:center;height:100vh;width:100%;
          padding:30px;
        }

        /* Glass chat wrapper */
        .chat-shell{
          width:460px; max-width:calc(100% - 40px);
          border-radius:28px; overflow:hidden;
          background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
          border:1px solid rgba(255,255,255,0.06);
          box-shadow:0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(0,234,255,0.04);
          backdrop-filter: blur(14px) saturate(120%);
          transform-origin:center;
          transition: transform 0.45s cubic-bezier(.2,.9,.2,1), box-shadow 0.45s;
        }

        /* Hover/Focus emphasis */
        .chat-shell:hover{transform:scale(1.02) translateY(-6px);box-shadow:0 18px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,234,255,0.12)}

        /* Header */
        .chat-head{
          display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.03);
          background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        }
        .logo {
          width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          background:linear-gradient(135deg,var(--accent-a),#3b82f6);box-shadow:0 6px 28px rgba(0,234,255,0.14), inset 0 -8px 36px rgba(255,255,255,0.02);
          transform-origin:center;animation:logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
        .logo img{width:44px;height:44px;border-radius:50%}
        .head-text h1{font-size:18px;margin-bottom:3px;color:var(--text-light);letter-spacing:0.2px}
        .head-text p{font-size:13px;color:var(--muted);margin:0}
        .status-dot{margin-left:auto;width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}

        /* messages area (transparent rounded rectangle inset) */
        .messages-wrap{
          padding:18px;margin:16px;border-radius:18px;background:rgba(255,255,255,0.02);
          border:1px solid rgba(255,255,255,0.03);min-height:380px;max-height:62vh;overflow:auto;
          box-shadow:inset 0 2px 12px rgba(0,0,0,0.25);
        }

        .msg-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:10px}
        .msg-row.user{justify-content:flex-end}
        .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:white;flex-shrink:0}
        .av.bot{background:linear-gradient(135deg,#00eaff,#3b82f6);box-shadow:0 6px 18px rgba(0,234,255,0.12)}
        .av.user{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 18px rgba(99,102,241,0.08)}

        .bubble{
          max-width:70%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.35;color:var(--text-light);
          box-shadow:0 6px 18px rgba(2,6,23,0.45);
        }
        .bubble.bot{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));color:var(--text-light);border-left:3px solid rgba(0,234,255,0.12)}
        .bubble.user{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border-right:3px solid rgba(255,255,255,0.06)}

        .meta{display:block;font-size:11px;color:var(--muted);margin-top:6px}

        /* options / upload button style */
        .options{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
        .opt-btn{padding:10px 16px;border-radius:999px;border:none;background:linear-gradient(90deg,rgba(0,234,255,0.08),rgba(255,112,166,0.06));color:var(--text-light);cursor:pointer;transition:all .18s}
        .opt-btn:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,234,255,0.08);background:linear-gradient(90deg,var(--accent-a),var(--accent-b));color:#001020}
        .upload-btn{padding:10px 14px;border-radius:12px;border:2px dashed rgba(255,255,255,0.06);background:transparent;color:var(--text-light);cursor:pointer;display:inline-flex;gap:8px;align-items:center}

        /* composer */
        .composer{display:flex;gap:12px;padding:14px;border-top:1px solid rgba(255,255,255,0.03);align-items:center}
        .input{flex:1;padding:12px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.04);background:rgba(3,7,23,0.38);color:var(--text-light);outline:none}
        .input:focus{box-shadow:0 6px 24px rgba(0,234,255,0.08);border-color:rgba(0,234,255,0.14)}
        .send{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#001020;font-size:18px;cursor:pointer;box-shadow:0 10px 30px rgba(0,234,255,0.12);transition:transform .18s}
        .send:hover{transform:scale(1.08) rotate(8deg)}

        /* responsive */
        @media (max-width:520px){
          .chat-shell{width:calc(100% - 24px);height:calc(100% - 48px);border-radius:18px}
          .messages-wrap{min-height:52vh}
        }
    </style>
</head>
<body>
<!-- Background animations -->
<div class="bg-wrap" aria-hidden="true">
    <div class="gradient-haze"></div>

    <div class="bubble-anim b1"></div>
    <div class="bubble-anim b2"></div>
    <div class="bubble-anim b3"></div>
    <div class="bubble-anim b4"></div>
    <div class="bubble-anim b5"></div>
    <div class="bubble-anim b6"></div>

    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>
    <div class="spark s5"></div>

    <div class="tiny t1"></div>
    <div class="tiny t2"></div>
    <div class="tiny t3"></div>
</div>

<div class="page">
    <div class="chat-shell" id="chatShell">
        <div class="chat-head">
            <div class="logo" title="FoodCare AI">
                <!-- 3D-ish glowing round bot image (inline img link) -->
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712107.png" alt="bot">
            </div>
            <div class="head-text">
                <h1>FoodCare Support</h1>
                <p id="botStatus">Connecting…</p>
            </div>
            <div class="status-dot" id="statusDot" aria-hidden="true"></div>
        </div>

        <div class="messages-wrap" id="chatMessages" role="log" aria-live="polite"></div>

        <div class="composer" aria-label="Message composer">
            <input id="userInput" class="input" type="text" placeholder="Type your message…" autocomplete="off" />
            <button id="sendBtn" class="send" title="Send message"><i class="fas fa-paper-plane"></i></button>
        </div>

        <!-- hidden file input (upload) -->
        <input id="photoInput" type="file" accept="image/*" style="display:none" />
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    // === Keep all logic & endpoints unchanged ===
    const statusEl   = document.getElementById("botStatus");
    const statusDot  = document.getElementById("statusDot");
    const messagesEl = document.getElementById("chatMessages");
    const inputEl    = document.getElementById("userInput");
    const photoInput = document.getElementById("photoInput");
    const sendBtn    = document.getElementById("sendBtn");
    const chatShell  = document.getElementById("chatShell");

    let lastSelectedOption = null;
    let complaintLocked = false; // when order not delivered

    // Keep original socket URL exactly
    function connectWS() {
      const token = localStorage.getItem("jwt");
      try {
        const socket = new SockJS("http://localhost:8080/ws");
        const stomp  = Stomp.over(socket);
        stomp.connect(
          { Authorization: "Bearer " + token },
          () => { statusEl.textContent = "Connected ✅"; statusEl.style.color = "lightgreen"; statusDot.style.background = "#22c55e"; },
          () => { statusEl.textContent = "Disconnected ❌"; statusEl.style.color = "red"; statusDot.style.background = "#ef4444"; setTimeout(connectWS, 3000); }
        );
      } catch (e) {
        statusEl.textContent = "Disconnected ❌"; statusEl.style.color = "red"; statusDot.style.background = "#ef4444";
      }
    }
    connectWS();

    /* UI helpers (preserve original semantics) */
    function addMessage(text, sender) {
      const row = document.createElement("div");
      row.className = 'msg-row ' + sender;

      const avatar = document.createElement("div");
      avatar.className = 'av ' + (sender === 'bot' ? 'bot' : 'user');
      avatar.innerHTML = sender === 'bot' ? '🤖' : '🧑';

      const bubble = document.createElement("div");
      bubble.className = 'bubble ' + sender;
      bubble.textContent = text;

      const meta = document.createElement("div");
      meta.className = 'meta';
      const now = new Date();
      meta.textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

      const cont = document.createElement("div");
      cont.appendChild(bubble);
      cont.appendChild(meta);

      if (sender === 'bot') {
        row.appendChild(avatar);
        row.appendChild(cont);
      } else {
        row.appendChild(cont);
        row.appendChild(avatar);
      }

      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showOptions(options) {
      const wrapper = document.createElement("div");
      wrapper.className = "options";
      options.forEach(opt => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = opt;
        b.onclick = () => handleOptionClick(opt);
        wrapper.appendChild(b);
      });
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showUploadButton() {
      if (complaintLocked) return;
      const btn = document.createElement("button");
      btn.className = "upload-btn";
      btn.innerHTML = '<i class="fas fa-camera"></i> Upload Photo';
      btn.onclick = () => photoInput.click();
      messagesEl.appendChild(btn);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function shouldShowUpload(option) {
      option = (option || "").toLowerCase();
      return option.includes("wrong") || option.includes("insect");
    }

    // Main handler — keep endpoints & logic intact
    async function handleOptionClick(selectedOption) {
      lastSelectedOption = selectedOption;
      addMessage(selectedOption, "user");

      const token = localStorage.getItem("jwt");
      try {
        const resp = await fetch("http://localhost:8080/api/chatbot/reply", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ selectedOption })
        });
        const data = await resp.json();

        addMessage(data.botMessage, "bot");

        if (Array.isArray(data.options) && data.options.length > 0) {
          showOptions(data.options);
        } else if (!complaintLocked && shouldShowUpload(selectedOption)) {
          showUploadButton();
        }
      } catch (err) {
        addMessage("Server not reachable.", "bot");
      }
    }

    // Photo upload — keep endpoint same
    photoInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      addMessage(`📎 Photo uploaded: ${file.name}`, "user");

      const token = localStorage.getItem("jwt");
      const form = new FormData();
      form.append("issueType", lastSelectedOption || "");
      form.append("message", "");
      form.append("extraChoice", "");
      form.append("photoFile", file);

      try {
        const res = await fetch("http://localhost:8080/api/chatbot/report-issue", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token },
          body: form
        });
        const data = await res.json();
        addMessage(data.botMessage, "bot");
      } catch (err) {
        addMessage("Upload failed.", "bot");
      }
    });

    /* Start sequence w/ order mapping — unchanged */
    window.onload = async () => {
      const token = localStorage.getItem("jwt");
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("orderid") || params.get("orderId");

      if (orderId) {
        try {
          const r = await fetch("http://localhost:8080/api/chatbot/set-order", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ orderId })
          });
          if (!r.ok) {
            complaintLocked = true;
            addMessage("You can place a complaint only after the order gets delivered.", "bot");
            showOptions(["Okay", "Talk to support"]);
            return;
          }
        } catch (e) {
          // fallback silently
        }
      }

      try {
        const res = await fetch("http://localhost:8080/api/chatbot/start", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        addMessage(data.botMessage, "bot");
        if (Array.isArray(data.options) && data.options.length > 0) showOptions(data.options);
      } catch (e) {
        addMessage("⚠️ Unable to connect. Login first!", "bot");
      }
    };

    // manual send (keeps original behavior)
    sendBtn.addEventListener("click", () => {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      handleOptionClick(text);
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendBtn.click(); }
    });

    // small micro-interaction: subtle shell pulse when new bot message arrived
    (function observeNewMessages(){
      const obs = new MutationObserver(() => {
        chatShell.style.transform = "scale(1.01)";
        setTimeout(()=>{ chatShell.style.transform = ""; }, 160);
      });
      obs.observe(messagesEl, { childList: true, subtree: false });
    })();
</script>
</body>
</html>
